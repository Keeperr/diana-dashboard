<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diana Fleet</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #eef0f4;
    --card: #ffffff;
    --line: #e1e4ea;
    --ink: #15171c;
    --mute: #5d6472;
    --faint: #9aa1ad;
    --diana: #6a45f5;
    --diana-soft: #efeaff;
    --work: #2f6fed;
    --work-soft: #e7efff;
    --wait: #c27a00;
    --wait-soft: #fff3dc;
    --ok: #12915a;
    --ok-soft: #e2f6ec;
    --idle: #8a919d;
    --idle-soft: #eef0f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Inter", "DejaVu Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: none; user-select: none;
  }
  /* The design is fixed at the Pi display size and scaled to fit anything bigger. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 480px; height: 320px;
    transform-origin: center;
    display: grid;
    grid-template-rows: 28px 44px 1fr;
    gap: 5px; padding: 5px 6px 6px;
  }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 4px;
  }
  .avatar {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--diana); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    position: relative;
  }
  .avatar::after {
    content: ""; position: absolute; right: -2px; bottom: -2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok); border: 2px solid var(--bg);
  }
  .who { line-height: 1.15; flex: 1; min-width: 0; }
  .who b { font-size: 14px; }
  .who span { display: block; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 9px; display: flex; flex-direction: column; justify-content: center;
  }
  .kpi small { font-size: 10.5px; color: var(--mute); white-space: nowrap; }
  .kpi strong { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi strong em { font-style: normal; font-size: 12px; color: var(--faint); font-weight: 600; }
  .kpi.alert strong { color: var(--wait); }

  main { display: grid; grid-template-columns: 1fr 156px; gap: 6px; min-height: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column; min-height: 0;
  }
  .panel h2 {
    font-size: 10.5px; font-weight: 600; color: var(--mute);
    padding: 3px 9px 2px; display: flex; justify-content: space-between;
  }

  .fleet { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .agent {
    flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 22px 1fr auto;
    align-items: center; gap: 7px; padding: 0 9px;
    border-top: 1px solid var(--line); position: relative;
  }
  .badge {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .meta { min-width: 0; line-height: 1.15; }
  .meta b { font-size: 12px; }
  .meta b i { font-style: normal; font-weight: 500; color: var(--faint); font-size: 10.5px; margin-left: 3px; }
  .meta span { display: block; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state {
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 99px;
    white-space: nowrap;
  }
  .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--work); transition: width 0.9s linear; }

  .s-working .state { background: var(--work-soft); color: var(--work); }
  .s-waiting .state { background: var(--wait-soft); color: var(--wait); }
  .s-waiting .bar { background: var(--wait); }
  .s-done .state { background: var(--ok-soft); color: var(--ok); }
  .s-done .bar { background: var(--ok); }
  .s-idle .state { background: var(--idle-soft); color: var(--idle); }
  .s-idle .meta span { color: var(--faint); }

  .feed { flex: 1; list-style: none; padding: 0 9px 4px; overflow: hidden; }
  .feed li {
    font-size: 10.5px; line-height: 1.3; color: var(--ink);
    padding: 4px 0; border-top: 1px solid var(--line);
    animation: in 0.5s ease-out;
  }
  .feed li:first-child { border-top: 0; }
  .feed time { display: block; font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .feed .d { color: var(--diana); font-weight: 600; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="avatar">D</div>
    <div class="who"><b>Diana</b><span id="summary">Orchestrator · starting up</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <section class="kpis">
    <div class="kpi"><small>Agents active</small><strong id="k-active">0<em>/6</em></strong></div>
    <div class="kpi"><small>Done today</small><strong id="k-done">0</strong></div>
    <div class="kpi"><small>In queue</small><strong id="k-queue">0</strong></div>
    <div class="kpi" id="k-wait-box"><small>Needs approval</small><strong id="k-wait">0</strong></div>
  </section>

  <main>
    <section class="panel">
      <h2><span>Fleet</span><span id="k-load">load 0%</span></h2>
      <div class="fleet" id="fleet"></div>
    </section>
    <section class="panel">
      <h2><span>Diana's log</span></h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </main>
</div>

<script>
// Proof of concept: all data below is simulated in the browser.
const AGENTS = [
  { name: "Atlas", role: "research", color: "#2f6fed", tasks: ["Summarise competitor pricing", "Scan new AI papers", "Compile market notes", "Check vendor docs for changes", "Brief on EU AI Act updates"] },
  { name: "Forge", role: "code", color: "#0f8a8a", tasks: ["Fix flaky login test", "Refactor billing webhook", "Bump dependencies", "Add retry to sync job", "Review open pull request"] },
  { name: "Quill", role: "writing", color: "#c2410c", tasks: ["Draft weekly newsletter", "Rewrite onboarding email", "Edit release notes", "Write FAQ answers", "Translate landing copy"] },
  { name: "Echo", role: "support", color: "#be185d", tasks: ["Triage support inbox", "Answer refund request", "Tag new tickets", "Escalate outage report", "Close resolved tickets"] },
  { name: "Ledger", role: "finance", color: "#4d7c0f", tasks: ["Reconcile card payments", "Match invoices to orders", "Flag duplicate charges", "Prepare monthly summary", "Check failed payouts"] },
  { name: "Sentinel", role: "security", color: "#6a45f5", tasks: ["Rotate expiring API keys", "Review access logs", "Check new dependencies", "Audit agent permissions", "Scan public buckets"] },
];
const NEEDS_APPROVAL = ["Answer refund request", "Rotate expiring API keys", "Check failed payouts", "Bump dependencies", "Escalate outage report"];

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hhmm = (d = new Date()) => d.toTimeString().slice(0, 5);

let done = 37 + Math.floor((new Date().getHours() * 60 + new Date().getMinutes()) / 9);
let queue = 4;

const fleet = document.getElementById("fleet");
const feed = document.getElementById("feed");

const agents = AGENTS.map((a, i) => {
  const el = document.createElement("div");
  el.className = "agent";
  el.innerHTML = `<div class="badge" style="background:${a.color}1a;color:${a.color}">${a.name.slice(0, 2)}</div>
    <div class="meta"><b>${a.name}<i>${a.role}</i></b><span></span></div>
    <div class="state"></div><div class="bar"></div>`;
  fleet.appendChild(el);
  const state = { ...a, el, task: pick(a.tasks), progress: rand(5, 85), status: "working", hold: 0 };
  if (i === 4) { state.status = "idle"; state.hold = 3; }
  return state;
});

function log(html) {
  const li = document.createElement("li");
  li.innerHTML = `<time>${hhmm()}</time>${html}`;
  feed.prepend(li);
  while (feed.children.length > 4) feed.lastChild.remove();
}

function assign(a) {
  const options = a.tasks.filter((t) => t !== a.task);
  a.task = pick(options);
  a.progress = 0;
  queue = Math.max(0, queue - 1);
  if (NEEDS_APPROVAL.includes(a.task) && Math.random() < 0.6) {
    a.status = "waiting";
    a.hold = Math.round(rand(8, 16));
    log(`<span class="d">Diana</span> paused ${a.name}: "${a.task}" needs approval`);
  } else {
    a.status = "working";
    log(`<span class="d">Diana</span> → ${a.name}: ${a.task}`);
  }
}

function tick() {
  for (const a of agents) {
    if (a.status === "working") {
      a.progress += rand(0.6, 3.2);
      if (a.progress >= 100) {
        a.progress = 100;
        a.status = "done";
        a.hold = 3;
        done++;
        log(`${a.name} finished "${a.task}"`);
      }
    } else if (a.status === "waiting") {
      if (--a.hold <= 0) {
        a.status = "working";
        log(`Approved · <span class="d">Diana</span> resumed ${a.name}`);
      }
    } else if (a.status === "done") {
      if (--a.hold <= 0) {
        if (queue > 0 || Math.random() < 0.5) assign(a);
        else { a.status = "idle"; a.hold = Math.round(rand(4, 10)); a.progress = 0; }
      }
    } else if (a.status === "idle") {
      if (--a.hold <= 0) assign(a);
    }
  }
  if (Math.random() < 0.12) queue = Math.min(9, queue + 1);
  render();
}

const LABEL = { working: (a) => `${Math.floor(a.progress)}%`, waiting: () => "approval", done: () => "done", idle: () => "idle" };

function render() {
  let active = 0, waiting = 0, load = 0;
  for (const a of agents) {
    a.el.className = `agent s-${a.status}`;
    a.el.querySelector(".meta span").textContent = a.status === "idle" ? "Waiting for work" : a.task;
    a.el.querySelector(".state").textContent = LABEL[a.status](a);
    a.el.querySelector(".bar").style.width = (a.status === "idle" ? 0 : a.progress) + "%";
    if (a.status === "working" || a.status === "waiting") active++;
    if (a.status === "waiting") waiting++;
    if (a.status === "working") load++;
  }
  document.getElementById("k-active").innerHTML = `${active}<em>/${agents.length}</em>`;
  document.getElementById("k-done").textContent = done;
  document.getElementById("k-queue").textContent = queue;
  document.getElementById("k-wait").textContent = waiting;
  document.getElementById("k-wait-box").classList.toggle("alert", waiting > 0);
  document.getElementById("k-load").textContent = `load ${Math.round((load / agents.length) * 100)}%`;
  document.getElementById("summary").textContent =
    `Orchestrator · ${active} running · ${queue} queued`;
}

function clock() { document.getElementById("clock").textContent = hhmm(); }

function fit() {
  const s = Math.min(innerWidth / 480, innerHeight / 320);
  document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}

addEventListener("resize", fit);
fit();
clock();
log(`<span class="d">Diana</span> online · 6 agents connected`);
render();
setInterval(tick, 1000);
setInterval(clock, 5000);
// Pick up new versions of the page on the kiosk without touching the Pi.
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
